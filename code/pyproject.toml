    "httpx>=0.28",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "matplotlib>=3.10.8",
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "playwright>=1.58.0",
    "tf-playwright-stealth>=1.2.0",
    "readability-lxml>=0.8.4.1",
    "lxml>=5.0",
]
